<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Эмодзи волка в качестве фавиконки -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐺</text></svg>">
    <title>Отдел продаж</title>
    <!-- Обновленная, стабильная версия stlite -->
    <link rel="stylesheet" href="https://unpkg.com/@stlite/mountable/build/stlite.css" />
  </head>
  <body style="margin: 0; padding: 0;">
    <div id="root"></div>
    <script src="https://unpkg.com/@stlite/mountable/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["pandas", "plotly"],
          entrypoint: "app.py",
          files: {
            "app.py": {
              url: "./app.py" 
            }
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
