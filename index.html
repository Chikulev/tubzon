<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>DWINA | OS</title>
    <!-- Обновленная, стабильная версия stlite -->
    <link rel="stylesheet" href="https://unpkg.com/@stlite/mountable/build/stlite.css" />
  </head>
  <body style="margin: 0; padding: 0;">
    <div id="root"></div>
    <script src="https://unpkg.com/@stlite/mountable/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["pandas", "plotly"],
          entrypoint: "app.py",
          files: {
            "app.py": {
              url: "./app.py" 
            }
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
